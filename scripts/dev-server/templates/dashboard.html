<!doctype html>
<html>
  <head>
    <title>NURETests Local Dev Server</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 2rem;
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        color: #818cf8;
        margin-bottom: 0.5rem;
      }
      p.subtitle {
        color: #94a3b8;
        margin-bottom: 2rem;
      }
      p.empty {
        color: #94a3b8;
      }
      .quiz-card {
        background: #1e293b;
        padding: 1.25rem;
        border-radius: 0.75rem;
        margin-bottom: 1.25rem;
        border: 1px solid #334155;
      }
      .quiz-card h3 {
        margin-top: 0;
        color: #e2e8f0;
        font-size: 1.1rem;
      }
      a {
        display: inline-block;
        background: #4f46e5;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-weight: bold;
        text-decoration: none;
        margin-top: 0.75rem;
        transition: background 0.2s;
      }
      a:hover {
        background: #4338ca;
      }
      a.secondary {
        background: #334155;
        margin-left: 0.5rem;
      }
      a.secondary:hover {
        background: #475569;
      }
      .badge {
        background: #334155;
        color: #cbd5e1;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        font-size: 0.8rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>NURETests Local Dev Server</h1>
    <p class="subtitle">
      Mock server for testing and previewing Moodle quiz parsing locally.
    </p>
    <div id="attempts">{{{ attempts }}}</div>
  </body>
</html>
