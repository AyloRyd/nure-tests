<!doctype html>

        class="que multichoice deferredfeedback notyetanswered"

          <h3 class="no">Питання <span class="qno">1</span></h3>

          <div class="formulation clearfix">
            <div class="qtext"><p>Pick the numbers greater than 1</p></div>

                  <input
                    type="checkbox"
                    name="q500:1_choice0"
                    value="1"
                    id="q500:1_choice0"
                    aria-labelledby="q500:1_choice0_label"

                    class="d-flex w-auto"
                    id="q500:1_choice0_label"

                    <span class="answernumber">a. </span>
                    <div class="flex-fill ms-1">1.5</div>

                </div>
                <div class="r1">
                  <input
                    type="checkbox"
                    name="q500:1_choice1"
                    value="1"
                    id="q500:1_choice1"
                    aria-labelledby="q500:1_choice1_label"
                  />
                  <div
                    class="d-flex w-auto"
                    id="q500:1_choice1_label"
                    data-region="answer-label"
                  >
                    <span class="answernumber">b. </span>
                    <div class="flex-fill ms-1">2.5</div>
                  </div>
                </div>
                <div class="r0">
                  <input
                    type="checkbox"
                    name="q500:1_choice2"
                    value="1"
                    id="q500:1_choice2"
                    aria-labelledby="q500:1_choice2_label"

                    class="d-flex w-auto"
                    id="q500:1_choice2_label"
                    data-region="answer-label"
                  >
                    <span class="answernumber">c. </span>
                    <div class="flex-fill ms-1">0.5</div>
                  </div>
                </div>
                <div class="r1">
                  <input
                    type="checkbox"
                    name="q500:1_choice3"
                    value="1"
                    id="q500:1_choice3"
                    aria-labelledby="q500:1_choice3_label"
                  />
                  <div
                    class="d-flex w-auto"
                    id="q500:1_choice3_label"
                    data-region="answer-label"
                  >
                    <span class="answernumber">d. </span>
                    <div class="flex-fill ms-1">X-ray</div>
                  </div>
                </div>
              </div>
            </fieldset>
          </div>
        </div>
      </div>

      <div

        </div>
        <div class="content">
          <div class="formulation clearfix">
            <div class="qtext"><p>Match the model to its level</p></div>
            <table class="answer">
              <tbody>
                <tr class="r0">
                  <td class="text"><p>ISO 9126</p></td>
                  <td class="control">
                    <select
                      class="select custom-select"
                      id="menuq500:2_sub0"
                      name="q500:2_sub0"
                    >
                      <option value="0" selected="selected">Вибрати...</option>
                      <option value="1">Hierarchical</option>
                      <option value="2">Flat</option>
                    </select>
                  </td>
                </tr>
                <tr class="r1">
                  <td class="text"><p>FURPS</p></td>
                  <td class="control">
                    <select
                      class="select custom-select"
                      id="menuq500:2_sub1"
                      name="q500:2_sub1"
                    >
                      <option value="0" selected="selected">Вибрати...</option>
                      <option value="1">Hierarchical</option>
                      <option value="2">Flat</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

                    name="q500:3_p1"
                    class="select custom-select place1"
                  >
                    <option value="">&nbsp;</option>
                    <option value="1">blue</option>
                    <option value="2">green</option>
                  </select></span
                >
                and grass is
                <span class="control group1"
                  ><select
                    id="q500:3_p2"
                    name="q500:3_p2"

                    <option value="">&nbsp;</option>
                    <option value="1">blue</option>
                    <option value="2">green</option>
                  </select></span
                >.

        <div class="content">
          <div class="formulation clearfix">
            <div class="qtext">
              <p>
                Cloze: 2 + 2 =

                <select name="q500:5_sub2_answer">
